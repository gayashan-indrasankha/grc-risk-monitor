l="#5b6776" font-weight="600" text-anchor="middle">1:many</text><text x="535" y="215" font-size="14" fill="#5b6776" font-weight="400" text-anchor="start">Requester and approver both link to employees.</text><text x="535" y="240" font-size="14" fill="#5b6776" font-weight="400" text-anchor="start">One invoice can have many payments, which is</text><text x="535" y="262" font-size="14" fill="#5b6776" font-weight="400" text-anchor="start">what lets a duplicate payment exist and be detected.</text></svg>