<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>End-to-end architecture of the GRC Risk Monitor</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1e36"/></marker></defs><rect width="1000" height="500" rx="14" fill="#ffffff"/><rect x="16" y="20" width="968" height="140" rx="12" fill="#f3f6fa"/><text x="36" y="45" font-size="12.5" fill="#5b6776" font-weight="700" text-anchor="start">LOCAL PIPELINE  ·  Python + SQL</text><rect x="16" y="180" width="968" height="140" rx="12" fill="#f3f6fa"/><text x="36" y="205" font-size="12.5" fill="#5b6776" font-weight="700" text-anchor="start">ANALYTICS  ·  Power BI</text><rect x="16" y="340" width="968" height="140" rx="12" fill="#f3f6fa"/><text x="36" y="365" font-size="12.5" fill="#5b6776" font-weight="700" text-anchor="start">ALERTS  ·  Microsoft cloud + Gmail</text><rect x="40" y="60" width="190" height="70" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="135.0" y="92.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Source CSVs</text><text x="135.0" y="112.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">61 synthetic records</text><rect x="280" y="60" width="190" height="70" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="375.0" y="92.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">SQLite database</text><text x="375.0" y="112.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">5 related tables</text><rect x="520" y="60" width="190" height="70" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="615.0" y="92.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Python detector</text><text x="615.0" y="112.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">runs 4 SQL control rules</text><rect x="760" y="60" width="190" height="70" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="855.0" y="92.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">exceptions.csv</text><text x="855.0" y="112.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">evidence + next action</text><rect x="520" y="220" width="190" height="70" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="615.0" y="252.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">5 reporting tables</text><text x="615.0" y="272.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">3 facts, 2 dimensions</text><rect x="280" y="220" width="190" height="70" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="375.0" y="252.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Power BI dashboard</text><text x="375.0" y="272.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">KPIs, charts, slicers</text><rect x="40" y="220" width="190" height="70" rx="9" fill="#fff4dc" stroke="#b26a00" stroke-width="1.6"/><text x="135.0" y="252.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Human review</text><text x="135.0" y="272.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">a person decides</text><rect x="760" y="380" width="190" height="70" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="855.0" y="412.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Excel Online</text><text x="855.0" y="432.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">exception register</text><rect x="520" y="380" width="190" height="70" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="615.0" y="412.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Power Automate</text><text x="615.0" y="432.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">High + Open + Pending</text><rect x="280" y="380" width="190" height="70" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="375.0" y="412.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Email alert</text><text x="375.0" y="432.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">synthetic test via Gmail</text><rect x="40" y="380" width="190" height="70" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="135.0" y="412.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Row marked Sent</text><text x="135.0" y="432.0" font-size="12.5" fill="#5b6776" font-weight="400" text-anchor="middle">with UTC timestamp</text><path d="M230 95H278" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><path d="M470 95H518" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><path d="M710 95H758" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><path d="M375 130V170H590V218" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><path d="M830 130V170H650V218" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><path d="M880 130V378" fill="none" stroke="#0f1e36" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#a)"/><path d="M520 255H472" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><path d="M280 255H232" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><path d="M760 415H712" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><path d="M520 415H472" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><path d="M280 415H232" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><path d="M375 380V330H135V292" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><text x="868" y="250" font-size="12.5" fill="#5b6776" font-weight="600" text-anchor="end">manual copy</text><text x="868" y="268" font-size="12.5" fill="#5b6776" font-weight="600" text-anchor="end">+ reconciliation</text></svg>