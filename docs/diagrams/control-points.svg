<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Where each control rule sits in the procurement process</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1e36"/></marker></defs><rect width="1000" height="320" rx="14" fill="#ffffff"/><rect x="30" y="130" width="180" height="62" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="120.0" y="166.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Purchase request</text><path d="M210 161H218" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><rect x="220" y="130" width="180" height="62" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="310.0" y="166.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Approval</text><path d="M400 161H408" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><rect x="410" y="130" width="180" height="62" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="500.0" y="166.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Supplier invoice</text><path d="M590 161H598" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><rect x="600" y="130" width="180" height="62" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="690.0" y="166.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Payment</text><path d="M780 161H788" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><rect x="790" y="130" width="180" height="62" rx="9" fill="#fff4dc" stroke="#b26a00" stroke-width="1.6"/><text x="880.0" y="166.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Human review</text><rect x="30" y="18" width="180" height="76" rx="9" fill="#fff4dc" stroke="#b26a00" stroke-width="1.4"/><text x="120" y="42" font-size="12.5" fill="#b26a00" font-weight="700" text-anchor="middle">R04 · Medium</text><text x="120" y="68" font-size="14.5" fill="#0f1e36" font-weight="600" text-anchor="middle">Split purchase</text><path d="M120 94V128" fill="none" stroke="#b26a00" stroke-width="1.7" marker-end="url(#a)"/><rect x="220" y="18" width="180" height="76" rx="9" fill="#fdecea" stroke="#c9372c" stroke-width="1.4"/><text x="310" y="42" font-size="12.5" fill="#c9372c" font-weight="700" text-anchor="middle">R03 · High</text><text x="310" y="68" font-size="14.5" fill="#0f1e36" font-weight="600" text-anchor="middle">Wrong approver</text><path d="M310 94V128" fill="none" stroke="#c9372c" stroke-width="1.7" marker-end="url(#a)"/><rect x="600" y="18" width="180" height="76" rx="9" fill="#fdecea" stroke="#c9372c" stroke-width="1.4"/><text x="690" y="42" font-size="12.5" fill="#c9372c" font-weight="700" text-anchor="middle">R01 · High</text><text x="690" y="68" font-size="14.5" fill="#0f1e36" font-weight="600" text-anchor="middle">Duplicate payment</text><path d="M690 94V128" fill="none" stroke="#c9372c" stroke-width="1.7" marker-end="url(#a)"/><rect x="600" y="230" width="180" height="76" rx="9" fill="#fdecea" stroke="#c9372c" stroke-width="1.4"/><text x="690" y="254" font-size="12.5" fill="#c9372c" font-weight="700" text-anchor="middle">R02 · High</text><text x="690" y="280" font-size="14.5" fill="#0f1e36" font-weight="600" text-anchor="middle">Paid, not approved</text><path d="M690 230V194" fill="none" stroke="#c9372c" stroke-width="1.7" marker-end="url(#a)"/><text x="30" y="275" font-size="14" fill="#5b6776" font-weight="400" text-anchor="start">Each rule checks one point in the process.</text><text x="30" y="297" font-size="14" fill="#5b6776" font-weight="400" text-anchor="start">Every finding then goes to a person to review.</text></svg>