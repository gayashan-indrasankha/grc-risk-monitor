<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Sequence of steps when an alert is sent</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1e36"/></marker></defs><rect width="1000" height="450" rx="14" fill="#ffffff"/><rect x="25" y="18" width="170" height="46" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="110.0" y="46.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Reviewer</text><path d="M110 64V440" stroke="#c6cfda" stroke-width="1.5"/><rect x="285" y="18" width="170" height="46" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="370.0" y="46.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Power Automate</text><path d="M370 64V440" stroke="#c6cfda" stroke-width="1.5"/><rect x="545" y="18" width="170" height="46" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="630.0" y="46.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Excel register</text><path d="M630 64V440" stroke="#c6cfda" stroke-width="1.5"/><rect x="805" y="18" width="170" height="46" rx="9" fill="#ffffff" stroke="#1f6feb" stroke-width="1.6"/><text x="890.0" y="46.0" font-size="15" fill="#0f1e36" font-weight="600" text-anchor="middle">Gmail</text><path d="M890 64V440" stroke="#c6cfda" stroke-width="1.5"/><rect x="300" y="228" width="660" height="168" rx="10" fill="#f3f6fa" stroke="#c6cfda"/><text x="316" y="250" font-size="12" fill="#5b6776" font-weight="700" text-anchor="start">FOR EACH ELIGIBLE FINDING</text><path d="M110 100H367" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><text x="240.0" y="92" font-size="13.5" fill="#0f1e36" font-weight="400" text-anchor="middle">Start the flow manually</text><path d="M370 135H627" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><text x="500.0" y="127" font-size="13.5" fill="#0f1e36" font-weight="400" text-anchor="middle">List all rows</text><path d="M630 170H373" fill="none" stroke="#0f1e36" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="500.0" y="162" font-size="13.5" fill="#0f1e36" font-weight="400" text-anchor="middle">All findings</text><path d="M370 195H410V215H374" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><text x="418" y="210" font-size="13.5" fill="#0f1e36" font-weight="400" text-anchor="start">Keep High + Open + Pending only</text><path d="M370 285H887" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><text x="630.0" y="277" font-size="13.5" fill="#0f1e36" font-weight="400" text-anchor="middle">Send synthetic test alert</text><path d="M890 325H373" fill="none" stroke="#0f1e36" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="630.0" y="317" font-size="13.5" fill="#0f1e36" font-weight="400" text-anchor="middle">Success</text><path d="M370 372H627" fill="none" stroke="#0f1e36" stroke-width="1.7" marker-end="url(#a)"/><text x="500.0" y="364" font-size="13.5" fill="#0f1e36" font-weight="400" text-anchor="middle">Set alert_status = Sent, add UTC time</text><text x="500" y="428" font-size="14" fill="#b26a00" font-weight="700" text-anchor="middle">Sent rows no longer match the filter on the next run.</text></svg>