name: Python GRC baseline tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  synthetic-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate synthetic local baseline
        run: |
          python scripts/generate_sample_data.py
          python scripts/setup_local.py
          python scripts/check_stage1.py
          python scripts/detect_exceptions.py
          python scripts/export_powerbi.py
      - name: Run automated unit and data-quality tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate synthetic pipeline reconciliation
        run: python scripts/stage5_validate.py
